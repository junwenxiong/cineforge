<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>影铸 Studio · AI 视频生成工作台</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1117'/%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='none' stroke='%23F5B041' stroke-opacity='0.55' stroke-width='1.5'/%3E%3Cpath d='M12 10.5L22.5 16L12 21.5V10.5Z' fill='%23F5B041'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/layout.css" />
  <link rel="stylesheet" href="/styles/views.css" />
  <link rel="stylesheet" href="/styles/studio.css" />
  <link rel="stylesheet" href="/styles/discover.css" />
  <link rel="stylesheet" href="/styles/workflow.css" />
  <link rel="stylesheet" href="/styles/farm_eval.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Minimal 3-Tab Topbar (Kling / Hailuo / SwarmUI style) -->
    <header class="topbar" id="app-topbar">
      <div class="topbar-inner">
        <a href="#studio" class="topbar-brand" title="回到生成视频">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="4.5" width="19" height="15" rx="3" />
              <path d="M10 9.5L15.5 12L10 14.5V9.5Z" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span class="brand-title">影铸 <span class="brand-title-en">Studio</span></span>
        </a>

        <nav class="topnav" aria-label="主导航">
          <a href="#studio" class="topnav-item" data-route="studio">
            <svg class="topnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            <span>生成视频</span>
          </a>

          <a href="#workflow" class="topnav-item" data-route="workflow">
            <svg class="topnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="6" height="6" rx="1.5" />
              <rect x="15" y="4" width="6" height="6" rx="1.5" />
              <rect x="9" y="14" width="6" height="6" rx="1.5" />
              <path d="M9 7h6M12 10v4" />
            </svg>
            <span>工作流</span>
          </a>

          <a href="#farm" class="topnav-item host-only" id="nav-farm" data-route="farm">
            <svg class="topnav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="5" width="14" height="14" rx="2.5" />
              <rect x="9" y="9" width="6" height="6" rx="1" />
              <path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" />
            </svg>
            <span>连接 Colab</span>
          </a>
        </nav>

        <div class="topbar-right">
          <a href="#farm" class="topbar-status-pill host-only" id="topbar-farm-pill" title="查看 Colab 算力连接状态">
            <span class="status-dot muted" id="topbar-farm-dot"></span>
            <span id="topbar-farm-text">检测状态中...</span>
          </a>

          <span class="topbar-guest-quota guest-only" id="topbar-guest-quota" title="当前会话剩余云端生成次数">
            免费额度 3/3
          </span>
        </div>
      </div>
    </header>

    <!-- Dynamic View Stage -->
    <main id="app-main" class="app-main" tabindex="-1"></main>
  </div>

  <!-- Global Video Lightbox Modal -->
  <div
    id="video-modal"
    class="video-modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="video-modal-title"
  >
    <div class="video-modal-dialog">
      <div class="video-modal-header">
        <div class="video-modal-meta">
          <div class="video-modal-title-row">
            <h2 class="video-modal-title" id="video-modal-title">成片播放</h2>
          </div>
          <p class="video-modal-subtitle" id="video-modal-subtitle"></p>
          <div class="video-modal-badges" id="video-modal-badges"></div>
        </div>
        <button type="button" class="video-modal-close" id="video-modal-close" aria-label="关闭播放器">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="video-modal-stage">
        <video
          id="video-modal-player"
          class="video-modal-player"
          controls
          playsinline
          preload="metadata"
        ></video>
        <div class="video-modal-mode-chip" id="video-modal-mode-chip" hidden>纯净成片</div>
      </div>

      <div class="video-modal-footer">
        <div class="video-modal-footer-left">
          <div class="segmented" id="video-modal-mode-switch" hidden>
            <button type="button" class="segmented-btn active" data-video-mode="clean">纯净成片</button>
            <button type="button" class="segmented-btn" data-video-mode="side_by_side">左右原片对照</button>
          </div>
        </div>

        <div class="video-modal-footer-right">
          <button type="button" class="btn btn-secondary btn-sm" id="video-modal-workflow-btn" hidden>
            查看工作流
          </button>
          <button type="button" class="btn btn-primary btn-sm" id="video-modal-clone-btn" hidden>
            用同款参数生成
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Global Toast Container -->
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
